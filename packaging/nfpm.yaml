# nfpm config for dwc-dp-analyser
# Build with:
#   VERSION=1.0.0 nfpm package --config nfpm.yaml --target dist/ --packager deb
#   VERSION=1.0.0 nfpm package --config nfpm.yaml --target dist/ --packager rpm
#
# nfpm expands ${VERSION} from the environment at build time — set it from
# your release tag (e.g. `VERSION=${GITHUB_REF_NAME#v}` in CI).

name: "dwc-dp-analyser"
arch: "all"
platform: "linux"
version: "${VERSION}"
section: "science"
priority: "optional"
maintainer: "Nikolaj Reibke <nreibke@gbif.org>"
description: |
  Validation and analysis CLI for Darwin Core Data Packages (DwC-DP).
  Runs Frictionless Data Package and DwC-DP schema/EML validation over
  local data packages using DuckDB.
vendor: "GBIF"
homepage: "https://github.com/gbif/dwc-dp-analyser"
license: "Apache-2.0"

# The jar itself has no native code, so one build serves deb and rpm alike.
# Point --packager at whichever format you're producing; arch stays "all"
# (nfpm maps this to "noarch" automatically for rpm).

depends:
  # Either package name satisfies a Java 17+ runtime on Debian/Ubuntu.
  - default-jre-headless | openjdk-17-jre-headless | openjdk-21-jre-headless

overrides:
  rpm:
    depends:
      - java-17-openjdk-headless
  archlinux:
    depends:
      - jre17-openjdk-headless

contents:
  # nfpm has no idea the Maven build embeds the pom version in the jar
  # filename (dwc-dp-analyser-cli-${VERSION}-runner.jar) — release.sh
  # glob-matches that jar and stages a copy here under a fixed name
  # before nfpm ever runs, so this path never needs to change.
  - src: ./packaging/staging/dwc-dp-analyser-cli-runner.jar
    dst: /usr/share/dwc-dp-analyser/dwc-dp-analyser-cli.jar
    file_info:
      mode: 0644

  # the bash wrapper — this is what ends up on PATH
  - src: ./packaging/dwc-dp-analyser
    dst: /usr/bin/dwc-dp-analyser
    file_info:
      mode: 0755

  # standard Debian/RPM doc locations
  - src: ./LICENSE
    dst: /usr/share/doc/dwc-dp-analyser/copyright
    file_info:
      mode: 0644
  - src: ./CHANGELOG.md
    dst: /usr/share/doc/dwc-dp-analyser/changelog
    file_info:
      mode: 0644
